spring:
  application:
    name: datastudio-server
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      pool-name: master-hikari-connection-pool
      connection-timeout: 60000
      maximum-pool-size: 20
      max-lifetime: 1800000
      keepalive-time: 1750000
    url: jdbc:mysql://${MYSQL_MASTER_HOST}:${MYSQL_MASTER_PORT:3306}/data_capture
    username: ${MYSQL_MASTER_USER}
    password: ${MYSQL_MASTER_PASSWORD}
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
  servlet:
    multipart:
      max-file-size: 100MB
datastudio:
  engine-config:
    artifacts-home: artifacts
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    use-generated-keys: true
server:
  port: 8083
  tomcat:
    max-http-response-header-size: 32KB
logging:
  level:
    org.springframework.security: debug

oauth2:
  client:
    providers:
      zitadel:
        issuer-uri: https://zitadel.k8s.dev
    registrations:
      datastudio:
        client-id: 394917405190586372
        client-secret: ${DATASTUDIO_CLIENT_SECRET}
        authorization-grant-type: authorization_code
        scope: openid,profile,offline_access
        provider: zitadel