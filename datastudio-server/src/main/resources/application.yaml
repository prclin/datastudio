spring:
  profiles:
    active: ${DS_PROFILE:development}
  application:
    name: datastudio-server
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      pool-name: master-hikari-connection-pool
      connection-timeout: 60000
      maximum-pool-size: 20
      max-lifetime: 1800000
      keepalive-time: 1750000
    url: jdbc:mysql://${MYSQL_MASTER_HOST:}:${MYSQL_MASTER_PORT:3306}/data_capture
    username: ${MYSQL_MASTER_USER:}
    password: ${MYSQL_MASTER_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
  servlet:
    multipart:
      max-file-size: 100MB
datastudio:
  engine-config:
    artifacts-home: artifacts
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    use-generated-keys: true
server:
  port: 8083
  tomcat:
    max-http-response-header-size: 32KB
logging:
  level:
    org.springframework.security: debug

oauth2:
  client:
    providers:
      zitadel:
        issuer-uri: ${zitadel.host}
    registrations:
      datastudio:
        client-id: ${DATASTUDIO_CLIENT_ID:}
        client-secret: ${DATASTUDIO_CLIENT_SECRET:}
        authorization-grant-type: authorization_code
        scope: openid,profile,offline_access,urn:zitadel:iam:user:resourceowner
        provider: zitadel
zitadel:
  host: ${ZITADEL_HOST:}
  admin-pat: ${ZITADEL_ADMIN_PAT:}
  setup:
    organization-name: ${ZITADEL_SETUP_ORGANIZATION_NAME:datastudio}
    project-name: ${ZITADEL_SETUP_PROJECT_NAME:datastudio}
    app-name: ${ZITADEL_SETUP_APP_NAME:datastudio-server}
    redirect-uris: ${ZITADEL_SETUP_APP_REDIRECT_URIS:http://localhost:${server.port:8080}/api/oauth2/code/*}
    response-types: oidc_response_type_code
    grant-types: oidc_grant_type_authorization_code,oidc_grant_type_refresh_token
    application-type: oidc_app_type_web
    auth-method-type: oidc_auth_method_type_basic
    development-mode: true
    access-token-type: oidc_token_type_bearer
    client_secret_file: ${java.io.tmpdir}/datastudio/zitadel-secret