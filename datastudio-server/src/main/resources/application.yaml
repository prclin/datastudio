spring:
  profiles:
    active: ${DATASTUDIO_PROFILE:development}
  application:
    name: datastudio-server
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      pool-name: master-hikari-connection-pool
      connection-timeout: 60000
      maximum-pool-size: 20
      max-lifetime: 1800000
      keepalive-time: 1750000
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DATASTUDIO_POSTGRES_HOST:}:${DATASTUDIO_POSTGRES_PORT:5432}/${DATASTUDIO_POSTGRES_DATABASE:datastudio}
    username: ${DATASTUDIO_POSTGRES_USER:}
    password: ${DATASTUDIO_POSTGRES_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:sql/runtime.schema.sql
      mode: always
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
datastudio:
  engine-config:
    artifacts-home: ${java.io.tmpdir}/datastudio/{orgId}/runtime/engine-config/{id}/artifacts
  hadoop:
    local:
      hadoop-configs:

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    use-generated-keys: true
  type-handlers-package: io.github.prclin.datastudio.server.infrastructure.persistence.mybatis
server:
  port: 8083
  tomcat:
    max-http-response-header-size: 32KB
logging:
  level:
    org.springframework.security: debug

oauth2:
  client:
    providers:
      zitadel:
        issuer-uri: ${zitadel.host}
    registrations:
      datastudio:
        client-id: ${DATASTUDIO_CLIENT_ID:}
        client-secret: ${DATASTUDIO_CLIENT_SECRET:}
        authorization-grant-type: authorization_code
        scope: openid,profile,offline_access,urn:zitadel:iam:user:resourceowner,urn:zitadel:iam:user:metadata
        provider: zitadel
zitadel:
  host: ${DATASTUDIO_ZITADEL_HOST:}
  admin-pat: ${DATASTUDIO_ZITADEL_ADMIN_PAT:}
  setup:
    organization-name: ${DATASTUDIO_ZITADEL_SETUP_ORGANIZATION_NAME:datastudio}
    project-name: ${DATASTUDIO_ZITADEL_SETUP_PROJECT_NAME:datastudio}
    app-name: ${DATASTUDIO_ZITADEL_SETUP_APP_NAME:datastudio-server}
    redirect-uris: ${DATASTUDIO_ZITADEL_SETUP_APP_REDIRECT_URIS:http://localhost:${server.port:8080}/api/oauth2/code/*}
    response-types: oidc_response_type_code
    grant-types: oidc_grant_type_authorization_code,oidc_grant_type_refresh_token
    application-type: oidc_app_type_web
    auth-method-type: oidc_auth_method_type_basic
    development-mode: true
    access-token-type: oidc_token_type_bearer
    client_secret_file: ${java.io.tmpdir}/datastudio/zitadel-secret
spicedb:
  grpc-endpoint: ${DATASTUDIO_SPICEDB_GRPC_ENDPOINT:}
  admin-pat: ${DATASTUDIO_SPICEDB_ADMIN_PAT:}
