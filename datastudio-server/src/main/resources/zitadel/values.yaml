# Quickstart values — full stack with bundled PostgreSQL.
# Uses postgresql.enabled=true to deploy a fully self-contained stack.
# All passwords are intentional dev placeholders.
# DO NOT use these values for any non-local deployment.

# Deploy PostgreSQL as a subchart. The chart auto-populates the ZITADEL
# database host, port, credentials, and SSL mode from the values below.
postgresql:
  enabled: false
  primary:
    service:
      enabled: false

zitadel:
  # Dev-only masterkey — generate a real one before any non-local deployment:
  # tr -dc A-Za-z0-9 </dev/urandom | head -c 32
  masterkey: "MasterkeyNeedsToHave32Characters"

  configmapConfig:
    ExternalDomain: zitadel.k8s.minikube   # replace with your domain or IP
    ExternalPort: 80            # replace with the port your ingress controller listens on
    ExternalSecure: false
    TLS:
      Enabled: false
    Database:
      postgres:
        Host: postgresql-hl.default.svc.cluster.local
        Port: 5432
        Database: zitadel
        User:
          Username: zitadel
          Password: zitadel
        Admin:
          ExistingDatabase: postgres
          Username: postgres
          Password: postgres
    FirstInstance:
      Org:
        Name: ZITADEL
        Human:
          UserName: admin
          Email: admin@zitadel.k8s.minikube
          Password: "Password!1"
          PasswordChangeRequired: false

# Set both ingress.className and login.ingress.className to the IngressClass of
# your ingress controller (e.g., "nginx", "traefik").
# For k3d or k3s, this is typically "traefik".
ingress:
  enabled: true
  # className: traefik
  hosts:
    - host: zitadel.k8s.minikube
      paths:
        - path: /
          pathType: Prefix

login:
  ingress:
    enabled: true
    # className: traefik
    hosts:
      - host: zitadel.k8s.minikube
        paths:
          - path: /ui/v2/login
            pathType: Prefix